[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-iot-fleet-provisioning"
version = "0.1.0"
description = "Zero-touch fleet provisioning on Azure IoT Hub DPS: three-level X.509 PKI, enrollment groups, revocation, rotation."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"

[project.scripts]
fleetctl = "service.cli:console"

[tool.setuptools]
packages = ["device", "pki", "service"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
